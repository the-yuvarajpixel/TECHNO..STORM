[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route all Sentinel API requests directly to the Netlify serverless Express backend
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback so deep links (/attacker, /executive, /admin) never return 404 on reload
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Allow Firebase signInWithPopup across browsers and set production security headers
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Immutable long-term CDN caching for Vite hashed static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always serve fresh HTML entrypoint after deployments
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
